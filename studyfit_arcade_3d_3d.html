<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDYFIT 3D ARCADE - 3D 픽셀 공부 탐험</title>
    
    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Retro Fonts (DungGeunMo Unified) -->
    <style>
        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            font-family: 'DungGeunMo', sans-serif !important;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b132b;
            color: #fff;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas#webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Top HUD Header */
        .hud-header {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid #38b6ff;
            border-radius: 12px;
            padding: 10px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(56, 182, 255, 0.3);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-title {
            color: #ffe600;
            font-size: 1.1rem;
            text-shadow: 2px 2px 0 #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: #f59e0b;
            color: #000;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .hud-btn {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border: 2px solid #fff;
            border-radius: 8px;
            color: #fff;
            padding: 8px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #0f172a;
            transition: all 0.1s;
            pointer-events: auto;
        }

        .hud-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f172a;
        }

        /* Quest Tracker Bottom-Left */
        .quest-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #ffe600;
            border-radius: 12px;
            padding: 12px 16px;
            max-width: 320px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
            z-index: 10;
        }

        .quest-title {
            color: #ffe600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quest-desc {
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .progress-bar-bg {
            background: #1e293b;
            border: 2px solid #000;
            height: 12px;
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Interaction Prompt Banner */
        .interact-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffe600;
            border-radius: 30px;
            padding: 12px 24px;
            color: #ffe600;
            font-size: 1rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.6);
            display: none;
            z-index: 15;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translate(-50%, -50%) translateY(0); }
            100% { transform: translate(-50%, -50%) translateY(-8px); }
        }

        /* Mobile Touch Controls */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .touch-btn {
            width: 64px;
            height: 64px;
            background: rgba(30, 58, 138, 0.85);
            border: 3px solid #38b6ff;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #0f172a;
            cursor: pointer;
            touch-action: manipulation;
        }

        .touch-btn:active {
            transform: translateY(3px);
            background: #38b6ff;
        }

        .dpad-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            z-index: 20;
        }

        .dpad-btn {
            background: rgba(30, 58, 138, 0.85);
            border: 2px solid #38b6ff;
            border-radius: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .dpad-btn:active { background: #38b6ff; }

        @media (min-width: 769px) {
            .dpad-container, .touch-controls {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .quest-box {
                bottom: 160px;
                left: 16px;
                max-width: 260px;
            }
        }

        /* Retro Modal Windows */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 19, 43, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #1e293b;
            border: 4px solid #38b6ff;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(56, 182, 255, 0.2);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px dashed #38b6ff;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.25rem;
            color: #ffe600;
            text-shadow: 2px 2px 0 #000;
            margin: 0;
        }

        .modal-close-btn {
            background: #ef4444;
            border: 2px solid #fff;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #f1f5f9;
        }

        .tip-tag {
            display: inline-block;
            background: #3b82f6;
            color: #fff;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .tip-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
        }

        .tip-box ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .tip-box li {
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        /* MBTI Selection Grid Styles */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .mbti-btn {
            background: #0f172a;
            border: 2px solid #38b6ff;
            color: #cbd5e1;
            padding: 8px 4px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .mbti-btn:hover {
            background: #1e3a8a;
            color: #ffe600;
            border-color: #ffe600;
        }

        .mbti-btn.active {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-weight: bold;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }

        .mbti-card {
            background: #0f172a;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 16px;
            margin-top: 14px;
        }

        .mbti-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px dashed #334155;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .mbti-persona-name {
            color: #ffe600;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .mbti-section-title {
            color: #38b6ff;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Character Customizer Styles inside Modal */
        .custom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .custom-item {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .custom-item-title {
            font-size: 0.8rem;
            color: #ffe600;
            margin-bottom: 8px;
        }

        .opt-btn-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .opt-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #000;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .opt-btn.selected {
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 8px #ffe600;
        }

        /* Quiz UI */
        .quiz-option {
            background: #0f172a;
            border: 2px solid #38b6ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .quiz-option:hover {
            background: #1e3a8a;
            border-color: #ffe600;
        }

        .quiz-feedback {
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .quiz-feedback.correct {
            background: #065f46;
            color: #34d399;
            border: 2px solid #10b981;
        }

        .quiz-feedback.wrong {
            background: #991b1b;
            color: #fca5a5;
            border: 2px solid #ef4444;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 3D Canvas -->
        <canvas id="webgl-canvas"></canvas>

        <!-- TOP HUD -->
        <div class="hud-header">
            <div class="hud-panel">
                <span class="hud-title">🎮 STUDYFIT 3D ARCADE</span>
                <span class="badge" id="mbti-badge">ESTJ</span>
            </div>

            <div style="display:flex; gap:8px;">
                <button class="hud-btn" onclick="openCustomizerModal()">🎨 캐릭터 변경</button>
                <button class="hud-btn" onclick="openPersonaModal()">⚡ MBTI 진단</button>
                <button class="hud-btn" onclick="toggleAudio()">🔊 Sound</button>
            </div>
        </div>

        <!-- QUEST TRACKER -->
        <div class="quest-box">
            <div class="quest-title">
                <span>🎯 스터디 꿀팁 탐험 퀘스트</span>
            </div>
            <div class="quest-desc" id="quest-text">
                섬을 거닐며 floating 항목 6개를 찾아 수집하세요!
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="quest-progress"></div>
            </div>
            <div style="font-size:0.75rem; text-align:right; margin-top:4px; color:#94a3b8;" id="progress-count">
                수집 현황: 0 / 6
            </div>
        </div>

        <!-- INTERACTION PROMPT -->
        <div class="interact-prompt" id="interact-prompt">
            [E] 키 또는 [클릭]하여 탐색하기 ✨
        </div>

        <!-- TOUCH CONTROLS FOR MOBILE -->
        <div class="dpad-container">
            <div></div>
            <div class="dpad-btn" id="btn-up">▲</div>
            <div></div>
            <div class="dpad-btn" id="btn-left">◀</div>
            <div></div>
            <div class="dpad-btn" id="btn-right">▶</div>
            <div></div>
            <div class="dpad-btn" id="btn-down">▼</div>
            <div></div>
        </div>

        <div class="touch-controls">
            <div class="touch-btn" id="btn-interact">🖐️</div>
            <div class="touch-btn" id="btn-jump">🚀</div>
        </div>
    </div>

    <!-- MODAL POPUP SYSTEM -->
    <div class="modal-overlay" id="main-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">상세 정보</h3>
                <button class="modal-close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <script>
        
        // Game State
        const state = {
            custom: { hair: 0, outfit: 0, acc: 0 },
            mbti: "ESTJ",
            collectedTips: new Set(),
            soundEnabled: true,
            activeZone: null,
            keys: { up: false, down: false, left: false, right: false, jump: false, interact: false }
        };

        // Web Audio API Procedural Sound Effects
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'open') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.06);
                osc.frequency.setValueAtTime(783.99, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

            const pathMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
            
            const mainPathGeo = new THREE.BoxGeometry(4, 0.1, 40);
            const mainPath = new THREE.Mesh(mainPathGeo, pathMat);
            mainPath.position.set(0, 0.31, 0);
            mainPath.receiveShadow = true;
            scene.add(mainPath);

            const crossPathGeo = new THREE.BoxGeometry(40, 0.1, 4);
            const crossPath = new THREE.Mesh(crossPathGeo, pathMat);
            crossPath.position.set(0, 0.31, 0);
            crossPath.receiveShadow = true;
            scene.add(crossPath);

            // Decorative Voxel Trees & Bookshelves
            createDecorativeTrees();
            createDecorativeBookshelves();
        }

        // Decorative Low-poly Voxel Trees
        function createDecorativeTrees() {
            const treePositions = [
                {x: -18, z: -18}, {x: 18, z: -18}, {x: -18, z: 18}, {x: 18, z: 18},
                {x: -22, z: 0}, {x: 22, z: 0}, {x: 0, z: -22}
            ];

            treePositions.forEach(p => {
                const trunkGeo = new THREE.BoxGeometry(0.8, 3, 0.8);
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.set(p.x, 1.5, p.z);
                trunk.castShadow = true;

                const leavesGeo = new THREE.BoxGeometry(3, 3, 3);
                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x059669 });
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.set(p.x, 4, p.z);
                leaves.castShadow = true;

                scene.add(trunk);
                scene.add(leaves);
            });
        }

        // Decorative Bookshelves & Desks around Library/Cafe zones
        function createDecorativeBookshelves() {
            const shelfGeo = new THREE.BoxGeometry(6, 4, 1.2);
            const shelfMat = new THREE.MeshStandardMaterial({ color: 0x854d0e });
            const shelf = new THREE.Mesh(shelfGeo, shelfMat);
            shelf.position.set(-15, 2, -14);
            shelf.castShadow = true;
            scene.add(shelf);

            const tableGeo = new THREE.CylinderGeometry(2, 2, 1.2, 12);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.set(15, 0.6, -14);
            table.castShadow = true;
            scene.add(table);
        }

        // Create 3D Voxel Player Mesh
        function createVoxelPlayer() {
            if (playerGroup) scene.remove(playerGroup);

            playerGroup = new THREE.Group();

            const pMatSkin = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const pMatHair = new THREE.MeshStandardMaterial({ color: COLOR_PALETTES.hair[state.custom.hair] });
            const pMatOutfit = new THREE.MeshStandardMaterial({ color: COLOR_PALETTES.outfit[state.custom.outfit] });
            const pMatPants = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const pMatEye = new THREE.MeshStandardMaterial({ color: 0x000000 });

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.5), pMatOutfit);
            body.position.y = 1.0;
            body.castShadow = true;
            playerGroup.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.8), pMatSkin);
            head.position.y = 1.95;
            head.castShadow = true;
            playerGroup.add(head);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.05), pMatEye);
            eyeL.position.set(-0.2, 2.0, 0.41);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.05), pMatEye);
            eyeR.position.set(0.2, 2.0, 0.41);
            playerGroup.add(eyeL);
            playerGroup.add(eyeR);

            // Hair
            const hair = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.4, 0.9), pMatHair);
            hair.position.set(0, 2.4, 0);
            hair.castShadow = true;
            playerGroup.add(hair);

            // Legs
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.6, 0.35), pMatPants);
            legL.position.set(-0.22, 0.3, 0);
            legL.castShadow = true;
            playerGroup.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.6, 0.35), pMatPants);
            legR.position.set(0.22, 0.3, 0);
            legR.castShadow = true;
            playerGroup.add(legR);

            // Accessories
            if (state.custom.acc === 1) { // Glasses
                const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const glasses = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.1), glassMat);
                glasses.position.set(0, 2.0, 0.43);
                playerGroup.add(glasses);
            } else if (state.custom.acc === 2) { // Headset
                const accMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
                const headset = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.2, 0.2), accMat);
                headset.position.set(0, 2.3, 0);
                playerGroup.add(headset);
            } else if (state.custom.acc === 3) { // Crown
                const accMat = new THREE.MeshStandardMaterial({ color: 0xec4899 });
                const crown = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), accMat);
                crown.position.set(0, 2.75, 0);
                playerGroup.add(crown);
            }

            playerGroup.position.set(player.x, player.y, player.z);
            scene.add(playerGroup);
        }

        // Build Floating Study Collectibles
        function buildStudyNodes() {
            STUDY_NODES.forEach(node => {
                const nodeGroup = new THREE.Group();
                nodeGroup.position.set(node.pos.x, node.pos.y, node.pos.z);

                const pedGeo = new THREE.CylinderGeometry(1.2, 1.5, 0.4, 16);
                const pedMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
                const ped = new THREE.Mesh(pedGeo, pedMat);
                ped.position.y = 0.2;
                ped.receiveShadow = true;
                nodeGroup.add(ped);

                const orbGeo = new THREE.OctahedronGeometry(0.8, 0);
                const orbMat = new THREE.MeshStandardMaterial({
                    color: node.color,
                    emissive: node.color,
                    emissiveIntensity: 0.6,
                    roughness: 0.2,
                    wireframe: false
                });
                const orb = new THREE.Mesh(orbGeo, orbMat);
                orb.position.y = 1.8;
                orb.castShadow = true;
                nodeGroup.add(orb);

                const pLight = new THREE.PointLight(node.color, 1.2, 8);
                pLight.position.set(0, 2, 0);
                nodeGroup.add(pLight);

                scene.add(nodeGroup);

                nodeMeshes.push({
                    group: nodeGroup,
                    orb: orb,
                    data: node
                });
            });
        }

        // Create 3D Orange Cat NPC
        function createCatNPC() {
            const catGroup = new THREE.Group();
            catGroup.position.set(3, 0.3, 3);

            const catMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.8), catMat);
            body.position.y = 0.25;
            body.castShadow = true;
            catGroup.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.5), catMat);

            const earL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.12), catEarMat);

        // Keyboard and Touch Event Controls
        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') state.keys.up = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') state.keys.down = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') state.keys.left = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') state.keys.right = true;
                if (e.code === 'Space') {
                    if (player.isGrounded) {
                        player.vy = 0.22;
                        player.isGrounded = false;
                        playSound('jump');
                    }
                }
                if (e.code === 'KeyE') {
                    triggerInteraction();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') state.keys.up = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') state.keys.down = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') state.keys.left = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') state.keys.right = false;
            });

            const bindTouchBtn = (id, keyName) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys[keyName] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); state.keys[keyName] = false; });
            };

            bindTouchBtn('btn-up', 'up');
            bindTouchBtn('btn-down', 'down');
            bindTouchBtn('btn-left', 'left');
            bindTouchBtn('btn-right', 'right');

            const btnJump = document.getElementById('btn-jump');
            if (btnJump) {
                btnJump.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (player.isGrounded) {
                        player.vy = 0.22;
                        player.isGrounded = false;
                        playSound('jump');
                    }
                });
            }

            const btnInteract = document.getElementById('btn-interact');
            if (btnInteract) {
                btnInteract.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    triggerInteraction();
                });
            }
        }

        // Physics & Movement Loop
        function updatePlayerPhysics() {
            let dx = 0;
            let dz = 0;

            if (state.keys.up) dz -= 1;
            if (state.keys.down) dz += 1;
            if (state.keys.left) dx -= 1;
            if (state.keys.right) dx += 1;

            if (dx !== 0 || dz !== 0) {
                const len = Math.sqrt(dx * dx + dz * dz);
                dx /= len;
                dz /= len;

                player.x += dx * player.speed;
                player.z += dz * player.speed;

                const angle = Math.atan2(dx, dz);
                playerGroup.rotation.y = angle;
            }

            player.vy -= 0.012;
            player.y += player.vy;

            if (player.y <= 0) {
                player.y = 0;
                player.vy = 0;
                player.isGrounded = true;
            }

            const distFromCenter = Math.sqrt(player.x * player.x + player.z * player.z);
            if (distFromCenter > 23.5) {
                const angle = Math.atan2(player.z, player.x);
                player.x = Math.cos(angle) * 23.5;
                player.z = Math.sin(angle) * 23.5;
            }

            playerGroup.position.set(player.x, player.y, player.z);

            const targetCamPos = new THREE.Vector3(player.x, player.y + 10, player.z + 14);
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(player.x, player.y + 1.5, player.z);

            checkProximity();
        }

        // Proximity detection for HUD interaction prompt
        function checkProximity() {
            let closeNode = null;
            const prompt = document.getElementById('interact-prompt');

            for (let item of nodeMeshes) {
                const d = Math.sqrt(
                    Math.pow(player.x - item.data.pos.x, 2) +
                    Math.pow(player.z - item.data.pos.z, 2)
                );

                if (d < 3.2) {
                    closeNode = item.data;
                    break;
                }
            }

            state.activeZone = closeNode;

            if (closeNode) {
                prompt.style.display = 'block';
                prompt.innerHTML = `✨ [${closeNode.name}] 탐색하기 (클릭/E)`;
            } else {
                prompt.style.display = 'none';
            }
        }

        function triggerInteraction() {
            if (!state.activeZone) return;

            const node = state.activeZone;
            playSound('coin');

            if (!state.collectedTips.has(node.id)) {
                state.collectedTips.add(node.id);
                updateQuestTracker();
            }

            if (node.isQuizMachine) {
                openQuizModal(node);
            } else if (node.isPersonaKiosk) {
                openPersonaModal();
            } else {
                openTipModal(node);
            }
        }

        function updateQuestTracker() {
            const count = state.collectedTips.size;
            const progressFill = document.getElementById('quest-progress');
            const progressCount = document.getElementById('progress-count');
            const questText = document.getElementById('quest-text');

            const pct = Math.min((count / 6) * 100, 100);
            progressFill.style.width = `${pct}%`;
            progressCount.innerText = `수집 현황: ${count} / 6`;

            if (count >= 6) {
                questText.innerHTML = "🎉 <b style='color:#ffe600;'>축하합니다! 모든 공부 꿀팁 탐험 완료!</b>";
            } else {
                questText.innerText = `섬 곳곳의 꿀팁 오르브를 발견하세요! (${count}/6 완료)`;
            }
        }

        // Modal Display Functions
        function openTipModal(node) {
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            title.innerText = node.name;

            let tipsList = node.tips ? node.tips.map(t => `<li>${t}</li>`).join('') : '';

            body.innerHTML = `
                <span class="tip-tag">🎯 ${node.tag}</span>
                <h4 style="color:#ffe600; font-size:1.1rem; margin:8px 0;">${node.title}</h4>
                <p>${node.desc}</p>
                <div class="tip-box">
                    <strong style="color:#38b6ff;">💡 핵심 실천 가이드:</strong>
                    <ul>${tipsList}</ul>
                </div>
            `;

            document.getElementById('main-modal').classList.add('active');
        }

        function openQuizModal(node) {
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            title.innerText = node.name;

            body.innerHTML = `
                <span class="tip-tag">🕹️ 공부법 O/X 퀴즈</span>
                <h4 style="color:#ffe600; margin:10px 0;">Q. "공부할 때 형광펜으로 여러 번 칠하면서 읽는 것이 가장 효과적인 암기법이다?"</h4>
                <div class="quiz-option" onclick="checkQuiz(false)">❌ O (그렇다)</div>
                <div class="quiz-option" onclick="checkQuiz(true)">⭕ X (아니다 - 능동적 인지 회상이 훨씬 효과적!)</div>
                <div id="quiz-feedback" class="quiz-feedback"></div>
            `;

            document.getElementById('main-modal').classList.add('active');
        }

        function checkQuiz(isCorrect) {
            const fb = document.getElementById('quiz-feedback');
            fb.style.display = 'block';
            if (isCorrect) {
                fb.className = 'quiz-feedback correct';
                fb.innerHTML = '🎉 정답입니다! 단순 재독(Re-reading)이나 형광펜 칠하기는 착시 효과만 줄 뿐, 백지 복습(Active Recall)이나 퀴즈 형태가 3배 이상 기억에 오래 남습니다!';
                playSound('coin');
            } else {
                fb.className = 'quiz-feedback wrong';
                fb.innerHTML = '❌ 아쉽습니다! 단순히 읽기만 하는 것은 뇌를 능동적으로 쓰지 않아 암기 효율이 떨어집니다. 직접 문제를 풀거나 백지에 적어보세요!';
            }
        }

        // Full 16 MBTI Persona Modal Engine
        function openPersonaModal() {
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            title.innerText = "⚡ 16가지 MBTI 스터디 페르소나 리포트";

            const allMbtis = Object.keys(MBTI_STUDY_DATA);

            body.innerHTML = `
                <p style="margin-bottom:10px; color:#cbd5e1; font-size:0.88rem;">
                    자신의 MBTI를 클릭하여 유형별 <b>최적 공부 장소, 공부 기술, 슬럼프 극복법, 추천 앱</b>을 확인해보세요!
                </p>
                <div class="mbti-grid">
                    ${allMbtis.map(m => `
                        <button class="mbti-btn ${m === state.mbti ? 'active' : ''}" 
                                id="mbti-btn-${m}"
                                onclick="selectPersonaMBTI('${m}')">${m}</button>
                    `).join('')}
                </div>
                <div id="mbti-detail-container"></div>
            `;

            document.getElementById('main-modal').classList.add('active');
            renderPersonaDetail(state.mbti);
        }

        function selectPersonaMBTI(mbti) {
            state.mbti = mbti;
            document.getElementById('mbti-badge').innerText = mbti;
            playSound('coin');

            // Update Active UI Button State
            document.querySelectorAll('.mbti-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`mbti-btn-${mbti}`);
            if (activeBtn) activeBtn.classList.add('active');

            renderPersonaDetail(mbti);
        }

        function renderPersonaDetail(mbti) {
            const container = document.getElementById('mbti-detail-container');
            if (!container) return;

            const data = MBTI_STUDY_DATA[mbti];
            if (!data) return;

            container.innerHTML = `
                <div class="mbti-card">
                    <div class="mbti-card-header">
                        <span class="mbti-persona-name">${data.persona}</span>
                        <span style="background:#10b981; color:#000; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:0.75rem;">[${mbti}]</span>
                    </div>

                    <div style="font-size:0.9rem; color:#f1f5f9; line-height:1.5; margin-bottom:12px;">
                        ${data.desc}
                    </div>

                    <div class="mbti-section-title">🏛️ 추천 스터디 공간</div>
                    <div style="color:#cbd5e1; font-size:0.85rem; margin-top:2px;">${data.location}</div>

                    <div class="mbti-section-title">🎯 핵심 공부 스타일 & 테크닉</div>
                    <div style="color:#ffe600; font-size:0.85rem; margin-top:2px;">${data.style}</div>

                    <div class="mbti-section-title">⚠️ 슬럼프 주의점 & 극복법</div>
                    <div style="color:#fca5a5; font-size:0.85rem; margin-top:2px;">${data.slump}</div>

                    <div class="mbti-section-title">🛠️ 추천 공부 도구 및 앱</div>
                    <div style="color:#34d399; font-size:0.85rem; margin-top:2px;">${data.tool}</div>
                </div>
            `;
        }

        function openCustomizerModal() {
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            title.innerText = "🎨 3D 캐릭터 커스터마이징";

            body.innerHTML = `
                <div class="custom-grid">
                    <div class="custom-item">
                        <div class="custom-item-title">헤어 스타일</div>
                        <div class="opt-btn-row">
                            ${[0,1,2,3].map(i => `
                                <div class="opt-btn ${state.custom.hair === i ? 'selected' : ''}" 
                                     style="background:#${COLOR_PALETTES.hair[i].toString(16)}"
                                     onclick="changeCustomParam('hair', ${i})"></div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="custom-item">
                        <div class="custom-item-title">의상 색상</div>
                        <div class="opt-btn-row">
                            ${[0,1,2,3].map(i => `
                                <div class="opt-btn ${state.custom.outfit === i ? 'selected' : ''}" 
                                     style="background:#${COLOR_PALETTES.outfit[i].toString(16)}"
                                     onclick="changeCustomParam('outfit', ${i})"></div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="custom-item" style="grid-column: span 2;">
                        <div class="custom-item-title">액세서리</div>
                        <div class="opt-btn-row">
                            <button class="hud-btn" onclick="changeCustomParam('acc', 0)">없음</button>
                            <button class="hud-btn" onclick="changeCustomParam('acc', 1)">👓 안경</button>
                            <button class="hud-btn" onclick="changeCustomParam('acc', 2)">🎧 헤드셋</button>
                            <button class="hud-btn" onclick="changeCustomParam('acc', 3)">👑 왕관</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('main-modal').classList.add('active');
        }

        function changeCustomParam(type, val) {
            state.custom[type] = val;
            createVoxelPlayer();
            playSound('coin');
            openCustomizerModal();
        }

        function closeModal() {
            document.getElementById('main-modal').classList.remove('active');
        }

        // Main Render Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            updatePlayerPhysics();

            nodeMeshes.forEach((item, idx) => {
                item.orb.rotation.y = elapsedTime * 1.5;
                item.orb.position.y = 1.8 + Math.sin(elapsedTime * 3 + idx) * 0.2;
            });

            if (catNpcMesh) {
                catNpcMesh.position.y = 0.3 + Math.abs(Math.sin(elapsedTime * 2)) * 0.1;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start Game on Window Load
        window.onload = function() {
            init3D();
            setupControls();
            animate();
            
            document.getElementById('interact-prompt').addEventListener('click', triggerInteraction);
        };
    </script>
